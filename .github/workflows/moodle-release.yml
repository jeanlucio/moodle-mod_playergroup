# See https://github.com/moodlehq/moodle-plugin-release
#
# Calls the moodlehq/moodle-plugin-release reusable workflow, which builds the plugin
# zip from the tagged commit and submits it to the Moodle Marketplace API
# (https://marketplace.moodle.com/api/plugins/{component}/versions).
#
# Required secret: MOODLE_MARKETPLACE_TOKEN
# (generate at https://marketplace.moodle.com/account/security)
#
# NOTE: automatic publishing on tag push is disabled for now (the "push: tags" trigger
# below is commented out) while this is being verified manually via workflow_dispatch.
# Uncomment it once a manual run has been confirmed to publish correctly.
#
# The previous version of this file targeted the legacy Plugins directory endpoint
# (local_plugins_add_version at moodle.org), retired when the Plugins directory went
# read-only on 2026-07-14 in favour of the Marketplace. This replaces it with the
# current Marketplace API.
#
name: Releasing in Moodle Marketplace

on:
  # push:
  #   tags:
  #     - v*

  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to be released (e.g. v1.3.5)'
        required: true
        type: string

jobs:
  release-to-marketplace:
    uses: moodlehq/moodle-plugin-release/.github/workflows/moodle-release.yml@main
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      MOODLE_MARKETPLACE_TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}
